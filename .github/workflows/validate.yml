name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - name: Download dataset from Hugging Face
        run: hf download wanhaoliu/OmniMatBench --repo-type dataset --local-dir . --include "qa/*" --include "cal/*"
      - run: python scripts/validate_data.py
